# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ouroboros"
BBFILE_PATTERN_meta-ouroboros = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ouroboros = "6"

LAYERDEPENDS_meta-ouroboros = "\
    core \
    swupdate \
    virtualization-layer \
    "
LAYERSERIES_COMPAT_meta-ouroboros = "wrynose"
